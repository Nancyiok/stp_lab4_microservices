services:
  users-db:
    image: postgres:17
    container_name: users-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders-db:
    image: postgres:17
    container_name: orders-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5434:5432"
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build: ./UserService
    container_name: user-service
    environment:
      ConnectionStrings__UsersDb: "Host=users-db;Port=5432;Database=users_db;Username=postgres;Password=postgres"
    ports:
      - "5001:8080"
    depends_on:
      users-db:
        condition: service_healthy

  order-service:
    build: ./OrderService
    container_name: order-service
    environment:
      ConnectionStrings__OrdersDb: "Host=orders-db;Port=5432;Database=orders_db;Username=postgres;Password=postgres"
      Services__UserServiceUrl: "http://user-service:8080/"
    ports:
      - "5002:8080"
    depends_on:
      orders-db:
        condition: service_healthy
      user-service:
        condition: service_started

volumes:
  users-data:
  orders-data:
